name: lending_club
title: Lending Club (Kaggle wordsforthewise/lending-club, accepted_2007_to_2018Q4)
description: Nhãn lấy từ cột trạng thái khoản vay (loan_status); chia theo thời gian; loại cột chỉ có sau khi vay theo từ điển của repo Eliza516/lending-club-credit-scoring (giả thuyết 'biết được lúc nộp
  đơn').
mapping:
  id: id
  open_date: issue_d
  status_col: loan_status
date_formats:
  issue_d: '%b-%Y'
  earliest_cr_line: '%b-%Y'
  last_pymnt_d: '%b-%Y'
load:
  keep_status: true
  min_open_year: 2010
  default_sample_rows: 300000
  skip_columns:
  - url
  - desc
  - emp_title
  - title
  - member_id
config_overrides:
  target:
    status:
      bad:
      - Charged Off
      good:
      - Fully Paid
      min_open_year: 2010
      maturity:
        enabled: true
        term_col: term_months
        asof_col: last_pymnt_d
  split:
    method: time
    train_pct: 0.8235
    test_pct: 0.1765
    oot:
      enabled: true
      pct: 0.15
      months: 3
    min_goods: 2000
    min_bads: 2000
  vintage:
    max_mob: 36
vintage_hint:
  first_bad_date_col: last_pymnt_d
  only_if_bad: true
  asof_col: last_pymnt_d
derived:
- name: term_months
  op: extract_number
  col: term
- name: emp_length_years
  op: extract_number
  col: emp_length
  overrides:
    < 1 year: 0
- name: credit_history_months
  op: months_between
  end: issue_d
  start: earliest_cr_line
- name: fico_mid
  op: mean_of
  cols:
  - fico_range_low
  - fico_range_high
drop_after_derive:
- term
- emp_length
- earliest_cr_line
- fico_range_low
- fico_range_high
identifier_columns:
- id
- member_id
- url
leakage_columns:
- funded_amnt
- funded_amnt_inv
- pymnt_plan
- initial_list_status
- policy_code
- disbursement_method
- out_prncp
- out_prncp_inv
- total_pymnt
- total_pymnt_inv
- total_rec_prncp
- total_rec_int
- total_rec_late_fee
- recoveries
- collection_recovery_fee
- last_pymnt_d
- last_pymnt_amnt
- next_pymnt_d
- last_credit_pull_d
- last_fico_range_high
- last_fico_range_low
- hardship_flag
- hardship_type
- hardship_reason
- hardship_status
- deferral_term
- hardship_amount
- hardship_start_date
- hardship_end_date
- payment_plan_start_date
- hardship_length
- hardship_dpd
- hardship_loan_status
- orig_projected_additional_accrued_interest
- hardship_payoff_balance_amount
- hardship_last_payment_amount
- debt_settlement_flag
- debt_settlement_flag_date
- settlement_status
- settlement_date
- settlement_amount
- settlement_percentage
- settlement_term
